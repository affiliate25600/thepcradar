        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
        <script type="text/javascript">
            (function() {
                // https://dashboard.emailjs.com/admin/account
                emailjs.init({
                    publicKey: "DBmoM8XM_BseMlxlk",
                });
            })();
        </script>

        <title>Contact Us | The PC Radar</title>

        <link rel="icon" type="image/x-icon" href="/favicon.svg">

        <link rel="stylesheet" href="/styles/general.css">
        <link rel="stylesheet" href="/styles/nav.css">
        <link rel="stylesheet" href="/styles/footer.css">
        <link rel="stylesheet" href="/styles/contact.css">

        <script src="/loader.js" defer></script>
        <script src="/contact-us/email.js" defer></script>
    </head>
    <body>
        <nav id="navbar"></nav>

        <main>
            <h1>Contact Us</h1>

            <form id="contact-form">
                <div class="form-group">
                    <h3>Name</h3>
                    <input id="form-name" name="name" type="text" placeholder="Name..." required>
                </div>
                <div class="form-group">
                    <h3>Email</h3>
                    <input id="form-email" name="email" type="email" placeholder="Email..." required>
                </div>
                <div class="form-group">
                    <h3>Message</h3>
                    <textarea id="form-message" name="message" placeholder="Message..." required></textarea>
                </div>
                <button type="submit">Submit</button>
                <p class="email-progress" id="email-progress"></p>
                <div class="loading" id="email-loading"></div>
            </form>
        </main>

        <footer id="footer"></footer>
    </body>
</html>
