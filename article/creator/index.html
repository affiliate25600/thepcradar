<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

        <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

        <title>Article Creator | The PC Radar</title>

        <!-- Stop from appearing on search engines -->
        <meta name="robots" content="noindex">

        <link rel="icon" type="image/x-icon" href="/favicon.svg">

        <link rel="stylesheet" href="/styles/general.css">
        <link rel="stylesheet" href="/styles/nav.css">
        <link rel="stylesheet" href="/styles/footer.css">
        <link rel="stylesheet" href="/styles/article.css">
        <link rel="stylesheet" href="/styles/template.css">

        <script src="/article/creator/article-loader.js" defer></script>
    </head>
    <body>
        <div class="upload-overlay" id="upload-overlay">
            <p>Drop File Here</p>
        </div>
        <input class="upload-box" id="upload-box" type="file" accept=".proj">

        <div class="export-options" id="export-options">
            <button class="export-btn" onclick="exportProject()">Project</button>
            <button class="export-btn" onclick="exportArticle()">Article</button>
            <button class="close-btn" onclick="closeExportOptions()">

            </button>
        </div>

        <div class="load-options" id="load-options">
            <p class="load-options-title">Projects</p>
            <div class="projects-container" id="projects-container"></div>
             <button class="close-btn" onclick="closeLoadOptions()">
                <svg fill="none" version="1.1" id="Capa_1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 460.775 460.775" xml:space="preserve"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M285.08,230.397L456.218,59.27c6.076-6.077,6.076-15.911,0-21.986L423.511,4.565c-2.913-2.911-6.866-4.55-10.992-4.55 c-4.127,0-8.08,1.639-10.993,4.55l-171.138,171.14L59.25,4.565c-2.913-2.911-6.866-4.55-10.993-4.55 c-4.126,0-8.08,1.639-10.992,4.55L4.558,37.284c-6.077,6.075-6.077,15.909,0,21.986l171.138,171.128L4.575,401.505 c-6.074,6.077-6.074,15.911,0,21.986l32.709,32.719c2.911,2.911,6.865,4.55,10.992,4.55c4.127,0,8.08-1.639,10.994-4.55 l171.117-171.12l171.118,171.12c2.913,2.911,6.866,4.55,10.993,4.55c4.128,0,8.081-1.639,10.992-4.55l32.709-32.719 c6.074-6.075,6.074-15.909,0-21.986L285.08,230.397z"></path> </g></svg>
            </button>
        </div>

        <aside id="article-editor"></aside>

        <div class="website-url" id="website-url"></div>
        <div class="website-preview">
            <main class="article" id="article"></main>
        </div>
    </body>
</html>
