<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

        <style>
            * {
                box-sizing: border-box;
            }

            nav {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: 5rem;

                background-color: red;
            }

            a {
                height: 100%;

                display: inline-block;
            }

            img {
                height: 100%;
            }
        </style>
    </head>
    <body>
        <nav>
            <a href="/">
                <img src="/images/logo.png" alt="logo">
            </a>
        </nav>
    </body>
</html>
