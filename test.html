<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>

        <style>
            * {
                margin: 0;
                padding: 0;

                box-sizing: border-box;

                --primary-bg-colour: #ACD0E6;
                --secondary-bg-colour: #8ACBF1;
                --accent-colour: #33A1E0;
                --primary-text-colour: #062B40;
                --secondary-text-colour: #044b73;
                --border-colour: #BCCCDC;
                --red-colour: rgb(239, 117, 117);
                --green-colour: rgb(72, 206, 72);

                color: inherit;

                font-family: "Poppins", Airal;
            }

            nav {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: 5rem;

                background-color: red;
            }

            a {
                height: 100%;

                display: inline-block;
            }

            img {
                height: 100%;
            }
        </style>
    </head>
    <body>
        <nav>
            <a href="/">
                <img src="/images/logo.png" alt="logo">
            </a>
        </nav>
    </body>
</html>
